name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Caladrius commit (or tag) whose browser application is served under /app/. Move it on
  # purpose, after the Caladrius change is merged; the page then shows exactly that version.
  CALADRIUS_REF: cb327a0811442edc89a0184c000abf081760aced

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Caladrius in the browser (/app/): built from the pinned commit by its own `cargo xtask web`.
      - uses: actions/checkout@v4
        with:
          repository: abdou-rgd/caladrius
          ref: ${{ env.CALADRIUS_REF }}
          path: caladrius
      - name: Install the Rust toolchain pinned by Caladrius
        working-directory: caladrius
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: caladrius
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Build Caladrius in the browser into dist/app
        working-directory: caladrius
        run: cargo xtask web --out "$GITHUB_WORKSPACE/site/dist/app"
      # A non-empty site/CNAME switches the build to the site's own domain (see site/README.md).
      - name: Copy CNAME
        run: if [ -s CNAME ]; then cp CNAME dist/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
